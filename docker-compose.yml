# Note: On Raspberry Pi 5 use Podman instead of Docker
# podman-compose up -d
# On production servers: docker-compose up -d

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: roadrunner-db
    environment:
      POSTGRES_USER: roadrunner
      POSTGRES_PASSWORD: roadrunner_dev
      POSTGRES_DB: roadrunner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadrunner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roadrunner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
