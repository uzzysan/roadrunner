name: Update SQLX Cache

on:
  workflow_dispatch:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/roadrunner_test

jobs:
  update-sqlx:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roadrunner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --version 0.7.3

      - name: Run Migrations
        run: |
          sqlx database create
          sqlx migrate run

      - name: Prepare SQLX
        run: cargo sqlx prepare

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .sqlx
          git diff --staged --quiet || (git commit -m "chore: update sqlx cache" && git push)
