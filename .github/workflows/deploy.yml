name: Deploy to VPS

# Runs after the Docker image build/push succeeds on main, or manually. SSHes into the target
# VPS and runs infra/install.sh there — that single script handles BOTH the first-ever bootstrap
# of a completely blank server (installs Docker, clones the repo, generates .env.production,
# brings up the stack) AND every later redeploy (pulls the repo + image, restarts). There is
# deliberately no separate "provisioning" step: fetching and running install.sh directly from
# GitHub means this works against a VPS that has nothing on it yet — the whole point is that
# handing a transportation company's dedicated server this way IS the install process.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions), set by a human, never by
# this workflow or by an AI session:
#   VPS_HOST     - the target server's hostname/IP (any VPS provider — not tied to one host)
#   VPS_SSH_USER - the deploy user on that server (needs sudo for the one-time Docker install)
#   VPS_SSH_KEY  - private key for a dedicated deploy keypair (do NOT reuse a personal key;
#                  generate one with `ssh-keygen -t ed25519 -f roadrunner_deploy_key -N ""`,
#                  add the public half to that user's ~/.ssh/authorized_keys on the server, and
#                  paste the private half in as this secret)
#   DOMAIN       - the domain this deployment should be reachable at (DNS must already point at
#                  VPS_HOST before the first run, so Caddy's automatic TLS can complete)
#   ACME_EMAIL   - contact address for Let's Encrypt expiry/problem notices
#
# Optional, only if ghcr.io/uzzysan/roadrunner is private:
#   GHCR_USER, GHCR_TOKEN - a GitHub username + a token with read:packages scope

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap and deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOMAIN,ACME_EMAIL,GHCR_USER,GHCR_TOKEN
          script: |
            export DOMAIN='${{ secrets.DOMAIN }}'
            export ACME_EMAIL='${{ secrets.ACME_EMAIL }}'
            export GHCR_USER='${{ secrets.GHCR_USER }}'
            export GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}'
            curl -fsSL https://raw.githubusercontent.com/uzzysan/roadrunner/main/infra/install.sh | bash
